# CI of EcoDB (#1362). The judge for every PR and every push to main: a clean Linux, the same throwaway test
# database as at home (docker-compose.testdb.yml) and the same script (scripts/ci/tests_api.sh).
# Secrets have their own workflow (gitleaks.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"  # the api image (api/Dockerfile)
          cache: pip
          cache-dependency-path: |
            api/requirements-test.txt
            api/constraints.txt

      # Only the light dependencies, with the production pins: the heavy model libraries are imported inside
      # the functions that use them, and the tests swap the embeddings/NER services for fake ones.
      - name: Install test dependencies
        id: install
        run: pip install -r api/requirements-test.txt -c api/constraints.txt

      # Code checks: settings in pyproject.toml, versions in requirements-lint.txt. Each check runs even if
      # another one failed, so one push shows everything that is wrong.
      - name: Install code-check tools
        id: lint_tools
        if: ${{ !cancelled() }}
        run: pip install -r requirements-lint.txt

      - name: ruff format --check
        if: ${{ !cancelled() && steps.lint_tools.outcome == 'success' }}
        run: ruff format --check .

      - name: ruff check
        if: ${{ !cancelled() && steps.lint_tools.outcome == 'success' }}
        run: ruff check .

      # Dead code in what runs in production (not tests, scripts or eval). Functions called through a decorator
      # (routes, MCP tools, pydantic validators) are not dead. It BLOCKS at 80 % confidence (unused imports and
      # locals, unreachable code: where real faults hide); the 60 % list (mostly pydantic fields FastAPI reads)
      # is printed as a report until it has its whitelist.
      # vulture exits 0 (clean) or 3 (found something); anything else (not installed, crash) is an error, so a
      # vulture that did not run can never pass as «no dead code» (the lesson of FarOS #1361).
      - name: vulture (dead code)
        if: ${{ !cancelled() && steps.lint_tools.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          args=(api mcp embeddings ner watchdog alerting --exclude "*/tests/*"
                --ignore-decorators "@router.*,@app.*,@mcp.*,@pytest.*,@field_validator,@model_validator,@validator")
          vulture "${args[@]}" --min-confidence 60 > vulture-60.txt 2>&1
          echo "report at 60 % confidence: $(grep -c . vulture-60.txt) findings (not blocking)"
          vulture "${args[@]}" --min-confidence 80 > vulture-80.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
              cat vulture-80.txt
              echo "::error::vulture did not run (exit code $status)"
              exit 1
          fi
          if [ "$status" -eq 3 ]; then
              cat vulture-80.txt
              echo "::error::dead code at 80 % confidence"
              exit 1
          fi
          echo "no dead code at 80 % confidence"

      # The compose file asks for these two with ${...:?}; the test database only needs them to exist. Random per
      # run, never written in the repo (the privacy pre-push refuses any password-looking value in clear).
      - name: Start the throwaway test database
        id: db
        run: |
          export ECODB_DB_PASSWORD="$(openssl rand -hex 16)"
          export CELL_DB_PASSWORD="$(openssl rand -hex 16)"
          docker compose -p ecodb-test -f docker-compose.yml -f docker-compose.testdb.yml up -d --wait postgres

      - name: Tests (one pytest per file)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.db.outcome == 'success' }}
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5436"
          TEST_API_URL: http://127.0.0.1:1
          # What runs today; if tests are removed on purpose, lower it in the same PR.
          MIN_TESTS: "713"
          OUT: test-results
        run: bash scripts/ci/tests_api.sh

      - name: Keep the test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Releases come out of main by themselves (#1362): the version is api/version.py, and when main has a
  # «## [X.Y.Z]» section for it in CHANGELOG.md and there is no release vX.Y.Z yet, it is published with that
  # section as notes, on the commit that passed «check». Only this job can write to the repo.
  release:
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Publish the release of this version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' api/version.py)
          if [ -z "$version" ]; then echo "::error::no __version__ in api/version.py"; exit 1; fi
          if gh release view "v$version" >/dev/null 2>&1; then
              echo "v$version is already published"
              exit 0
          fi
          # index() and not a regex: in an awk string «\[» does not escape (the EcoRelay lesson).
          awk -v h="## [$version]" 'index($0, h) == 1 {f = 1; next} f && /^## \[/ {exit} f {print}' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
              echo "no CHANGELOG section for $version: nothing to publish"
              exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
